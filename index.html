<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trilha de Estudos</title>
  <meta name="description" content="Quiz de estudo no estilo trilha: lições curtas, guias, consulta rápida e revisão de erros para várias matérias.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">

  <div id="shell">

  <script src="conteudos/banco-de-dados.js"></script>
  <script src="conteudos/sistemas-operacionais.js"></script>
  <!-- ===== fim dos conteúdos ===== -->

  <!-- oficina de diagramas ER (usada pela matéria Banco de Dados) e app -->
  <script src="js/tasks.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>

</html>
